name: 09-Functions build pipeline for python application

on:
  push:
    branches:
      - main
      - feature1
    paths:
      - '.github/workflows/**'
      - 'app.py'

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - ready_for_review

env:
  APPLICATION_NAME: muntaha-python-app
  DOCKER_USERNAME: muntaha747

jobs:
  flask-build-test-publish-job:
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' && startsWith(github.ref_name, 'feature1')) || (github.event_name == 'pull_request' && !contains(github.event.pull_request.title, 'WIP')) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Dynamic Image Tag
        run: |
          echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Display Build Information
        run: |
          echo "Application: ${APPLICATION_NAME}"
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Actor: ${GITHUB_ACTOR}"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Image Tag: ${IMAGE_TAG}"

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      - name: Run the Container
        run: |
          docker run -d \
            -p 5000:5000 \
            --name Flask-App-Container \
            ${DOCKER_USERNAME}/${APPLICATION_NAME}:${IMAGE_TAG}

      - name: Smoke Test
        run: |
          sleep 5
          curl --fail http://localhost:5000
          curl --fail http://localhost:5000/health

      - name: Push Image to Docker Hub
        if: ${{ success() }}
        run: |
          docker push ${DOCKER_USERNAME}/${APPLICATION_NAME}:${IMAGE_TAG}

      - name: Collect Container Logs
        if: ${{ failure() }}
        run: |
          docker logs Flask-App-Container || true

      - name: Cleanup Container
        if: ${{ always() }}
        run: |
          docker rm -f Flask-App-Container || true