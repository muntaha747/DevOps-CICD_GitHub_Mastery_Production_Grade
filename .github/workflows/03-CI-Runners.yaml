name: 03-CI-Runners
on: 
    workflow_dispatch:
    push:
    pull_request:
jobs:
    runner-info-job:
        runs-on: ubuntu-latest
        steps:
            - name: Print runner details
              run: |
                echo "Workflow is executing on a github-hosted runner"
                echo "Runner Name: ${RUNNER_NAME}"
                echo "Runner OS: ${RUNNER_OS}"
                echo "Runner Architecture: ${RUNNER_ARCH}"