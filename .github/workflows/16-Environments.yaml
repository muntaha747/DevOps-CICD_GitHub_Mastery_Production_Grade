name: 16-Environments

on:
  push:
    branches: [main, develop, feature1]

jobs:
  build-job:
    name: Build and Publish the Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push the Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.1
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/devops-cicd_github_mastery_production_grade:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/devops-cicd_github_mastery_production_grade:latest

  deploy-dev-job:
    name: Deploy To Dev Environment
    if: github.ref_name == 'develop'
    needs: build-job
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Display Branch Information
        run: |
          echo "Branch: ${{ github.ref_name }}"

      - name: Display Environment Configuration
        run: |
          echo "Application URL: ${{ vars.APP_URL }}"
          echo "Debug Mode: ${{ vars.DEBUG_MODE }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Docker Container
        run: |
          docker run -d -p 5000:5000 --name Muntaha-Flask-Container \
          ${{ vars.DOCKERHUB_USERNAME }}/devops-cicd_github_mastery_production_grade:${{ github.sha }}

      - name: Smoke Test
        run: |
          sleep 5
          curl --fail http://127.0.0.1:5000/
          curl --fail http://127.0.0.1:5000/health

      - name: Display Docker Logs
        run: docker logs Muntaha-Flask-Container

  deploy-feature-job:
    needs: [build-job, deploy-dev-job]
    name: Deploy To Feature Environment
    if: github.ref_name == 'feature1'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Display Branch Information
        run: |
          echo "Branch: ${{ github.ref_name }}"

      - name: Display Environment Configuration
        run: |
          echo "Application URL: ${{ vars.APP_URL }}"
          echo "Debug Mode: ${{ vars.DEBUG_MODE }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Docker Container
        run: |
          docker run -d -p 5000:5000 --name Muntaha-Flask-Container \
          ${{ vars.DOCKERHUB_USERNAME }}/devops-cicd_github_mastery_production_grade:${{ github.sha }}

      - name: Smoke Test
        run: |
          sleep 5
          curl --fail http://127.0.0.1:5000/
          curl --fail http://127.0.0.1:5000/health

      - name: Display Docker Logs
        run: docker logs Muntaha-Flask-Container

  deploy-prod-job:
    name: Deploy To Prod Environment
    if: github.ref_name == 'main'
    needs: build-job
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Display Branch Information
        run: |
          echo "Branch: ${{ github.ref_name }}"

      - name: Display Environment Configuration
        run: |
          echo "Application URL: ${{ vars.APP_URL }}"
          echo "Debug Mode: ${{ vars.DEBUG_MODE }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Docker Container
        run: |
          docker run -d -p 5000:5000 --name Muntaha-Flask-Container \
          ${{ vars.DOCKERHUB_USERNAME }}/devops-cicd_github_mastery_production_grade:${{ github.sha }}

      - name: Smoke Test
        run: |
          sleep 5
          curl --fail http://127.0.0.1:5000/
          curl --fail http://127.0.0.1:5000/health

      - name: Display Docker Logs
        run: docker logs Muntaha-Flask-Container