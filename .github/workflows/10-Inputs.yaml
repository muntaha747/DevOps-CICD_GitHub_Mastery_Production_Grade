name: 10 - Build, Test, and Package Artifacts Using Runtime Inputs Before Execution

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment Environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - qa
          - prod

      perform_smoke_test:
        description: Execute Smoke Test
        required: true
        type: boolean
        default: true

env:
  APPLICATION_NAME: devops-cicd_github_mastery_production_grade
  DOCKER_USERNAME: muntaha747

jobs:
  job1-checkout-test-build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out the Codebase Repository
        uses: actions/checkout@v4

      - name: Create Dynamic Image Tag
        run: |
          echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Display Input Values
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Perform Smoke Test: ${{ inputs.perform_smoke_test }}"

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      - name: Run QA Validation
        if: ${{ inputs.environment == 'qa' }}
        run: |
          echo "Running QA validation checks"
          echo "Running security validation"
          echo "Running integration validation"
          echo "QA validation checks completed successfully"

      - name: Log In to DockerHub
        if: ${{ inputs.environment != 'dev' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the Docker Image
        if: ${{ inputs.environment != 'dev' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      - name: Run the Container
        run: |
          docker run -d -p 5000:5000 --name Flask-Container \
            ${{ env.DOCKER_USERNAME }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      - name: Check Docker Logs
        if: ${{ inputs.environment != 'dev' }}
        run: |
          docker logs Flask-Container

      - name: Run Smoke Test
        if: ${{ inputs.perform_smoke_test == true }}
        run: |
          sleep 5
          if curl --fail http://localhost:5000/health; then
            echo "Smoke test passed successfully"
          else
            echo "Smoke test failed"
            exit 1
          fi

      - name: Deploy to EKS Cluster
        if: ${{ inputs.environment == 'prod' }}
        run: |
          echo "Deploying the application stack to the EKS cluster..."
          echo
          echo "Deployment completed successfully"
          echo
          echo