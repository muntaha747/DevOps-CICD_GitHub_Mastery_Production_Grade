name: 13-B-Jobs-Output

on:
  workflow_dispatch:

jobs:
  Job1-deployment_job:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Application
        id: Deploy
        run: |
          echo "Deploying Application"
          sleep 3
          echo "Deployment_url=https://google.com" >> $GITHUB_OUTPUT

    outputs:
      deployment_url: ${{ steps.Deploy.outputs.Deployment_url }}

  Job2-notify-job:
    runs-on: ubuntu-latest
    needs:
      - Job1-deployment_job
    steps:
      - name: Send Notification
        id: deploy-results
        run: |
          echo "Sending Notifications..."
          echo "Application URL: - ${{ needs.Job1-deployment_job.outputs.deployment_url }}"
          echo "Application_ID=payment-service" >> $GITHUB_OUTPUT

    outputs:
        deployment_app-name: ${{ steps.deploy-results.outputs.Application_ID }}