name: 06-actions-Pipeline
on: push
jobs:
    Job-1-flask-job:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Login to the Dockerhub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }} 
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            
            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                context: .
                push: true
                tags: muntaha747/muntaha-flask:v1.0.2


            - name: Run the Container
              run: docker run -d -p 5000:5000 --name  cicd-flask-container muntaha747/muntaha-flask:v1.0.2 

            - name: Debugging the container
              run: |
                docker ps -a
                docker logs cicd-flask-container

            - name: Smoke Test
              run: |
                sleep 5
                curl http://localhost:5000